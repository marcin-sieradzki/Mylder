  - region "Datatilstande":
    - heading "Datatilstande" [level=3]
    - list:
      - listitem:
        - text: Live
        - paragraph: Køretøjet har selv meldt denne position inden for omtrent de seneste to forespørgsler.
      - listitem:
        - text: Ældre
        - paragraph: Køretøjets seneste melding er ældre end det, men under 5 minutter; prikken kører videre fra den langs linjen.
      - listitem:
        - text: Beregnet
        - paragraph: "Ingen ny melding, men Rejseplanen har stadig turen: en position, den har beregnet, eller forventede tider."
      - listitem:
        - text: Kun køreplan
        - paragraph: Ingen realtid for turen i dag, så den er placeret efter køreplanen. Det gælder alle metrotog.
      - listitem:
        - text: Intet signal
        - paragraph: Turen havde realtid, og den stoppede for 5 minutter siden eller mere; prikken kører efter køreplanen og sin seneste forsinkelse.
    - paragraph: "Indtil videre er et køretøj Beregnet, placeret ud fra sin forsinkelse, eller Kun køreplan: der er endnu ingen livepositioner."
  - region "Denne side":
    - heading "Denne side" [level=3]
    - paragraph: Positionerne på denne side er køreplanens plan, ikke meldinger fra køretøjerne.
    - term: Kilde
    - definition: Rejseplanens køreplan, endnu ingen livepositioner
    - term: Positioner
    - definition: Ingen positionskald
    - term: Rejseplanens realtid
    - definition: Ikke koblet på endnu
    - term: Forsinkelser
    - definition: Rejseplanens SIRI-ET, opdateret 09:05:22
    - term: Forespørgsel
    - definition: Hvert 60. sekund
    - term: Databudget
    - definition: Normalt
    - term: Kald denne måned
    - definition: "0"
    - term: Serverlager
    - definition: Tilgængeligt
    - term: Driftsforstyrrelser
    - definition: Ikke koblet på endnu
  - region "Taster":
    - heading "Taster" [level=3]
    - list:
      - listitem:
        - paragraph: + og − zoomer kortet.
      - listitem:
        - paragraph: ← → ↑ ↓ flytter det.
      - listitem:
        - paragraph: Skift + ← og → drejer kortet.
      - listitem:
        - paragraph: Skift + ↑ og ↓ vipper det.
      - listitem:
        - paragraph: Esc lukker køretøjets kort eller panel.
      - listitem:
        - paragraph: Pauseknappen ved siden af zoomknapperne stopper køretøjerne, og afspilningsknappen sætter dem i gang igen.