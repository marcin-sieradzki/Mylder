- region "Notifikationer"
- dialog "Om Mylder":
  - heading "Om Mylder" [level=2]
  - button "Luk"
  - paragraph: Et livekort over Københavns busser, S-tog, metro og tog, ærligt om hvor friske positionerne er.
  - paragraph: Mylder viser data, som Rejseplanen sender dem, med Rejseplanens egne ord og sprog, og markerer hvert tal, Mylder selv regner ud.
  - paragraph: "Mylder er ikke-kommercielt: ingen reklamer, ingen betalt version og intet salg af data eller af noget, der er bygget på dem."
