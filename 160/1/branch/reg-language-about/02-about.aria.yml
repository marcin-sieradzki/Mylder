- region "Notifications"
- dialog "About Mylder":
  - heading "About Mylder" [level=2]
  - button "Close"
  - paragraph: A live map of Copenhagen's buses, S-tog, Metro and trains, honest about how fresh each position is.
  - paragraph: Mylder shows the data as Rejseplanen sends it, in its own words and language, and marks every figure it works out itself.
  - paragraph: "Mylder is non-commercial: no advertising, no paid tier, and no sale of the data or of anything built on it."
  - region "Data and credits":
    - heading "Data and credits" [level=3]
    - paragraph:
      - text: "Realtime data and the timetable:"
      - link "Rejseplanen":
        - /url: https://www.rejseplanen.dk/
      - text: ", under"
      - link "CC BY 4.0":
        - /url: https://creativecommons.org/licenses/by/4.0/
      - text: . Timetable of 2 June.
    - paragraph:
      - text: "Map: ©"
      - link "OpenStreetMap contributors":
        - /url: https://www.openstreetmap.org/copyright
      - text: under the
      - link "ODbL":
        - /url: https://opendatacommons.org/licenses/odbl/
      - text: ", ©"
      - link "OpenMapTiles":
        - /url: https://openmaptiles.org/
      - text: ","
      - link "OpenFreeMap":
        - /url: https://openfreemap.org/
      - text: .
    - paragraph:
      - text: "Aircraft: ©"
      - link "adsb.lol contributors":
        - /url: https://adsb.lol/
      - text: under the
      - link "ODbL":
        - /url: https://opendatacommons.org/licenses/odbl/
      - text: .
    - paragraph:
      - text: The planes are recorded adsb.lol data, open under the same licence in
      - link "Mylder's repository":
        - /url: https://github.com/marcin-sieradzki/mylder/tree/main/recordings
      - text: .
    - paragraph:
      - text: "The map's style is a fork of OpenFreeMap's Positron, itself from OpenMapTiles' Positron GL Style: see"
      - link "its licence":
        - /url: https://github.com/marcin-sieradzki/mylder/blob/main/src/map/style/LICENSE.md
      - text: .
  - region "Data states":
    - heading "Data states" [level=3]
    - list:
      - listitem:
        - text: Live
        - paragraph: The vehicle itself reported this position within about the last two polls.
      - listitem:
        - text: Ageing
        - paragraph: The vehicle's last report is older than that but under 5 minutes; the dot moves on from it along the line.
      - listitem:
        - text: Estimated
        - paragraph: "No recent report, but Rejseplanen still has the trip: a position it computed, or expected times."
      - listitem:
        - text: Timetable only
        - paragraph: No realtime for this trip today, so it is placed from the timetable. Every Metro train is.
      - listitem:
        - text: No signal
        - paragraph: The trip had realtime, and it stopped 5 minutes ago or more; the dot moves on the timetable and its last delay.
  - region "This page":
    - heading "This page" [level=3]
    - paragraph: The vehicles on this page are not real.
    - term: Source
    - definition: A recording, weekday
    - term: Positions
    - definition: Reports and computed positions, by turns
    - term: Rejseplanen's realtime
    - definition: 07:23:00
    - term: Poll
    - definition: Every 60 s
    - term: Data budget
    - definition: Normal
    - term: Calls this month
    - definition: "9"
    - term: Server store
    - definition: Available
    - term: Disruptions
    - definition: Checked 07:20
  - region "Keys":
    - heading "Keys" [level=3]
    - list:
      - listitem:
        - paragraph: + and − zoom the map.
      - listitem:
        - paragraph: ← → ↑ ↓ move it.
      - listitem:
        - paragraph: Shift + ← and → turn the map.
      - listitem:
        - paragraph: Shift + ↑ and ↓ tilt it.
      - listitem:
        - paragraph: Esc closes the vehicle card or panel.
      - listitem:
        - paragraph: The pause button, beside the zoom buttons, stops the vehicles moving, and the play button starts them again.