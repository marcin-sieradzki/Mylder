name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The timetable job's commits start no workflow, so its new timetable is checked here, after a
  # run that worked, and the demo takes it up.
  workflow_run:
    workflows: [Timetable]
    types: [completed]
    branches: [main]

jobs:
  check:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # A commit names who wrote it with its Co-Authored-By trailer, never a link to the session.
      - if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          if git log --format=%B "origin/$BASE..HEAD" | grep -nE 'Claude-Session:|claude\.ai/code/session_'; then
            echo "A commit message above links a session: reword it, keeping the Co-Authored-By trailer." >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  e2e:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # The GitHub Pages demo (ADR 0013): the static export with the simulated tracker in a Web
  # Worker, tested on its build, and deployed from main.
  demo:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run demo
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:demo
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: demo-playwright-report
          path: playwright-report
          retention-days: 7
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

  # The repository's Pages source must be set to GitHub Actions.
  deploy-demo:
    needs: [check, demo]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
