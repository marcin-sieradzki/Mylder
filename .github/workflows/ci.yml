name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The timetable job's commits start no workflow, so the demo takes up a new timetable here.
  workflow_run:
    workflows: [Timetable]
    types: [completed]
    branches: [main]

jobs:
  check:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  e2e:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # The GitHub Pages demo (ADR 0013): the static export with the simulated tracker in a Web
  # Worker, tested on its build, and deployed from main.
  demo:
    # After a Timetable run, only when it worked; the check and e2e jobs ran on its commit's
    # code already.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run demo
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:demo
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: demo-playwright-report
          path: playwright-report
          retention-days: 7
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

  # The repository's Pages source must be set to GitHub Actions.
  deploy-demo:
    needs: demo
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
